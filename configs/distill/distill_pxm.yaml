distill:
  # Teacher / student
  teacher_checkpoint: "data/trained_models/pxm/checkpoints/pocketxmol.ckpt"
  teacher_train_config: ""
  student_init: "teacher"   # teacher | random | checkpoint
  student_checkpoint: ""
  resume: ""
  task_name: "sbdd"

  # Karras schedule (rho=7)
  num_steps: 50
  karras:
    sigma_min: 0.002
    sigma_max: 80.0
    rho: 7.0

  # Loss
  loss_weights:
    pos: 1.0
    node: 1.0
    halfedge: 1.0
    physics: 0.0

  ema_decay: 0.999

  optimization:
    lr: 1.0e-5
    weight_decay: 1.0e-4
    beta1: 0.9
    beta2: 0.999

  train:
    seed: 2026
    batch_size: 8
    num_workers: 2
    pin_memory: true
    persistent_workers: true
    max_steps: 50000
    grad_clip: 1.0
    log_interval: 50
    ckpt_interval: 1000
    eval_interval: 10000

  wandb:
    enabled: false
    project: "pocketxmol-consistency"
    name: ""

  online_eval:
    enabled: false
    config_task: "configs/sample/test/sbdd_csd/simple.yml"
    sample_steps: [4]
    num_mols: 100
    outdir: "outputs_consistency_online_eval"

  # Optional default ckpt for eval script
  eval_checkpoint: ""


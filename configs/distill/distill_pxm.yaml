distill:
  # Teacher / student
  teacher_checkpoint: "data/trained_models/pxm/checkpoints/pocketxmol.ckpt"
  teacher_train_config: ""
  student_init: "teacher"   # teacher | random | checkpoint
  student_checkpoint: ""
  resume: ""
  task_name: "sbdd"
  data_override:
    root: "./data_train"
    assembly_path: "assemblies/split_csd.lmdb" # assembly_path: "assemblies/split_reduced_assembly.lmdb"
    db_ratio:
      csd: 1.0
  # Optional: override teacher train data path for current machine.
  # data_override:
  #   root: "/shared/healthinfolab/phz24002/PocketXMol/data"
  #   assembly_path: "assemblies/cls30.lmdb"   # script will use cls30_train.lmdb
  #   # Optional: override db ratio for the selected task only
  #   # db_ratio:
  #   #   csd: 1.0
  #   # Optional: provide full dataset block (advanced)
  #   # dataset:
  #   #   root: "/path/to/data"
  #   #   assembly_path: "assemblies/xxx.lmdb"
  #   #   dbs: [...]

  # Karras schedule (rho=7) or log_uniform
  num_steps: 50
  schedule: "log_uniform"  # "karras" or "log_uniform"
  karras:
    sigma_min: 0.002
    sigma_max: 80.0
    rho: 7.0

  # Loss
  loss_weights:
    pos: 1.0
    node: 1.0
    halfedge: 1.0
    physics: 0.0

  ema_decay: 0.999

  optimization:
    lr: 1.0e-5
    weight_decay: 1.0e-4
    beta1: 0.9
    beta2: 0.999

  train:
    seed: 2026
    batch_size: 8
    # Safe defaults for many shared servers; increase only if /dev/shm is sufficient.
    num_workers: 4
    pin_memory: false
    persistent_workers: false
    max_steps: 100000
    grad_clip: 1.0
    log_interval: 50
    ckpt_interval: 1000
    eval_interval: 10000

  wandb:
    enabled: true
    project: "pocketxmol-consistency"
    name: "sbdd-distill-run1"
    entity: ""
    id: ""                  # optional fixed run id
    resume: "allow" # allow | must | never



  online_eval:
    enabled: true
    config_task: "configs/sample/test/sbdd_csd/simple.yml"
    sample_steps: [4]
    num_mols: 100
    outdir: "outputs_consistency_online_eval"

  # Optional default ckpt for eval script
  eval_checkpoint: ""
